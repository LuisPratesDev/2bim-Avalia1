<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <main>
        <header>
            <p class="selo"><span class="ponto" aria-hidden="true"></span>tabuada modular · no círculo</p>
            <h1>Desenho <em>Assinado</em></h1>
            <p class="subtitulo">Escolha um número entre 1 e 100. A figura é gerada pelo servidor e assinada com o e-mail da conta Google usada no login.</p>
        </header>

        <form id="formulario" novalidate>
            <div class="campo">
                <div class="campo-topo">
                    <label for="numero">
                        Número
                    </label>
                    <span class="faixa" aria-hidden="true">01 — 100</span>
                </div>

                <input 
                    id="numero"
                    name="numero"
                    type="number"
                    min="1" 
                    max="100" 
                    step="1"
                    required
                    placeholder="Insira o número..."
                >
            </div>

            <div class="acessos">
                <div id="google-login" class="google"></div>

                <button type="submit">Desenhar</button>
            </div>
        </form>

        <p id="mensagem" role="alert"></p>

        <figure id="desenho" aria-live="polite"></figure>

        <button id="baixar" type="button" hidden>Baixar SVG</button>

        <footer class="rodape">
            <p>
                <span>240 pontos</span>
                <span>k = n + 1</span>
                <span>svg 800 × 880</span>
            </p>
        </footer>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
